<!DOCTYPE html>
<html lang="zh-HK"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>形態訓練營</title>
<style>
:root{--bg:#f4f6f8;--card:#fff;--fg:#1f2328;--muted:#667080;--line:#d0d7de;--accent:#1565c0;--accent-fg:#fff;--accent-weak:#e3f2fd;--alt:#78909c;--ok:#0a7d32;--ok-bg:#e8f5e9;--bad:#c62828;--bad-bg:#ffebee;--warn:#f9a825;--warn-bg:#fff8e1;--tag:#e8eaf6;--tag-fg:#283593;--sim:#e65100;--sim-bg:#fff3e0;--hl:#6a1b9a;--hl-bg:#f3e5f5;--chart-bg:#fff;--chart-grid:#eee;--chart-axis:#777;--res:#e65100;--sup:#1565c0;--user:#8e24aa;--shadow:0 1px 3px #0002}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1216;--card:#181c22;--fg:#e6e8eb;--muted:#9aa4b2;--line:#2e3540;--accent:#4c8dff;--accent-weak:#1c2a44;--alt:#4a5868;--ok:#5cc463;--ok-bg:#16301b;--bad:#ff6b66;--bad-bg:#3a1a1a;--warn:#f9a825;--warn-bg:#332a10;--tag:#252b45;--tag-fg:#b8c2ff;--sim:#ffb074;--sim-bg:#3a2510;--hl:#d6a8f5;--hl-bg:#2e1d3a;--chart-bg:#12161b;--chart-grid:#232a33;--chart-axis:#8b95a3;--res:#ff9e57;--sup:#64a8ff;--user:#e07bff;--shadow:0 1px 3px #0008}}
:root[data-theme="dark"]{--bg:#0f1216;--card:#181c22;--fg:#e6e8eb;--muted:#9aa4b2;--line:#2e3540;--accent:#4c8dff;--accent-weak:#1c2a44;--alt:#4a5868;--ok:#5cc463;--ok-bg:#16301b;--bad:#ff6b66;--bad-bg:#3a1a1a;--warn:#f9a825;--warn-bg:#332a10;--tag:#252b45;--tag-fg:#b8c2ff;--sim:#ffb074;--sim-bg:#3a2510;--hl:#d6a8f5;--hl-bg:#2e1d3a;--chart-bg:#12161b;--chart-grid:#232a33;--chart-axis:#8b95a3;--res:#ff9e57;--sup:#64a8ff;--user:#e07bff;--shadow:0 1px 3px #0008}
*{box-sizing:border-box}
body{font-family:-apple-system,"PingFang HK","Microsoft JhengHei",sans-serif;margin:0;background:var(--bg);color:var(--fg);line-height:1.55}
main{max-width:860px;margin:auto;padding:12px 16px 40px}
.card{background:var(--card);border-radius:12px;padding:14px 16px;margin:10px 0;box-shadow:var(--shadow)}
h1{font-size:21px;margin:6px 0}h2{font-size:19px;margin:6px 0}h3{font-size:16px;margin:14px 0 6px}
.tags{display:flex;flex-wrap:wrap;gap:4px;align-items:center;margin-bottom:6px}
.tag{display:inline-block;background:var(--tag);color:var(--tag-fg);border-radius:12px;padding:1px 10px;font-size:12px}
.tag.sim{background:var(--sim-bg);color:var(--sim)}.tag.hl{background:var(--hl-bg);color:var(--hl);font-weight:bold}
button{background:var(--accent);color:var(--accent-fg);border:0;border-radius:8px;padding:10px 16px;font-size:15px;cursor:pointer;margin:4px 4px 4px 0;font-family:inherit}
button.alt{background:var(--alt);color:#fff}button.sm{padding:5px 11px;font-size:13px}button:disabled{opacity:.5;cursor:default}
.opt{display:block;border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin:5px 0;cursor:pointer}
.opt:has(input:checked){background:var(--accent-weak);border-color:var(--accent)}
.guess{display:inline-flex;gap:4px;align-items:center;font-size:12px;color:var(--muted);cursor:pointer;margin:2px 0 4px;padding:2px 8px;border:1px dashed var(--line);border-radius:12px}
.guess:has(input:checked){color:var(--hl);border-color:var(--hl);background:var(--hl-bg)}
textarea{width:100%;height:64px;font-size:14px;font-family:inherit;background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:6px}
select{font-size:14px;padding:4px;background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:6px}
table{border-collapse:collapse;width:100%;font-size:13px;margin:6px 0}td,th{border:1px solid var(--line);padding:5px;vertical-align:top}th{background:var(--accent-weak);text-align:left}
.ok{color:var(--ok);font-weight:bold}.bad{color:var(--bad);font-weight:bold}
.warn{background:var(--warn-bg);border-left:4px solid var(--warn);padding:8px 10px;margin:8px 0;border-radius:4px}
.badbox{background:var(--bad-bg);border-left:4px solid var(--bad);padding:8px 10px;margin:8px 0;border-radius:4px}
.okbox{background:var(--ok-bg);border-left:4px solid var(--ok);padding:8px 10px;margin:8px 0;border-radius:4px}
.warn ul,.badbox ul{margin:4px 0;padding-left:20px}
tr.blind td{background:var(--bad-bg)}
.small{font-size:12px;color:var(--muted)}
canvas{width:100%;display:block;border:1px solid var(--line);border-radius:6px}
.q{border-top:1px dashed var(--line);padding-top:8px;margin-top:8px}
.cvwrap{position:relative}
.cover{position:absolute;inset:0;background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:22px;border-radius:6px;border:1px solid var(--line)}
.cover[hidden]{display:none}
.tbar{height:4px;background:var(--accent);border-radius:2px;margin:4px 0;width:100%}
.nameopts{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px;margin:8px 0}
.nameopts button{margin:0;background:var(--card);color:var(--fg);border:1px solid var(--line)}
.nameopts button:disabled{opacity:.55}.nameopts button.right,.nameopts button.wrong{opacity:1}
.nameopts button.right{background:var(--ok-bg);border-color:var(--ok);color:var(--ok);font-weight:bold}
.nameopts button.wrong{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;margin:10px 0}
.mode{background:var(--card);border-radius:12px;padding:12px 14px;box-shadow:var(--shadow);cursor:pointer;border:1px solid transparent}
.mode:hover{border-color:var(--accent)}.mode b{font-size:16px}.mode p{margin:4px 0 0;font-size:13px;color:var(--muted)}
.stats4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center;margin:10px 0 6px}
.stats4 b{display:block;font-size:20px}.stats4 span{font-size:12px;color:var(--muted)}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ok)}
.mbar{display:inline-block;width:90px;height:8px;background:var(--line);border-radius:4px;overflow:hidden;vertical-align:middle;margin-right:6px}.mbar i{display:block;height:100%}
.rec{display:block;width:100%;text-align:left;background:var(--card);color:var(--fg);border:1px solid var(--line);margin:6px 0}
.rec.main{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.rec span{display:block;font-size:12px;opacity:.8;margin-top:2px}
.path li{margin:3px 0}.path .done{color:var(--ok)}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:640px){.pair{grid-template-columns:1fr}.grid{grid-template-columns:1fr 1fr;gap:8px}.mode{padding:10px}.mode b{font-size:15px}.stats4 b{font-size:17px}}
.plabel{font-weight:bold;margin:4px 0}
.sch{width:100%;max-width:180px;height:auto;display:block;background:var(--chart-bg);border:1px solid var(--line);border-radius:6px}
.lgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.lcard{background:var(--card);border-radius:10px;padding:10px;box-shadow:var(--shadow);cursor:pointer;border:1px solid transparent}.lcard:hover{border-color:var(--accent)}
.mn{background:var(--hl-bg);color:var(--hl);padding:6px 10px;border-radius:8px;font-weight:bold}
.answer p{margin:6px 0}
.rate{display:flex;flex-wrap:wrap;gap:4px}
.scroll{overflow-x:auto}
table.cm td,table.cm th{text-align:center;padding:4px;min-width:34px}
.spark{width:100%;max-width:420px;height:70px;display:block}
.srs{font-size:13px;background:var(--accent-weak);padding:6px 10px;border-radius:8px;margin:8px 0}
.drawhelp{font-weight:bold;color:var(--user);margin:6px 0}
details summary{cursor:pointer;font-weight:bold}
.set label{display:block;margin:6px 0}
.mco{display:block;width:100%;text-align:left;background:var(--card);color:var(--fg);border:1px solid var(--line);margin:6px 0;line-height:1.45}
.mco:disabled{opacity:.6}.mco.right{background:var(--ok-bg);border-color:var(--ok);color:var(--ok);font-weight:bold;opacity:1}.mco.wrong{background:var(--bad-bg);border-color:var(--bad);color:var(--bad);opacity:1}
.qtext{font-size:16px;margin:8px 0 10px}.qtext ul{margin:6px 0;padding-left:22px}.qtext table{font-size:13px}
.jlbox{background:var(--accent-weak);border-left:4px solid var(--accent);padding:8px 10px;margin:8px 0;border-radius:4px}
.pts li{margin:6px 0}h3.sec{margin:18px 4px 0}.emo.sel{outline:3px solid var(--accent);background:var(--accent-weak)}.pcard{text-align:center}.path a{color:inherit}
</style></head><body><main id="app"></main>

 '「2加1」畫法：兩點畫一條線，再平行複製到第三點——比三點式更早更準。',
 '2加1 之後第一、二個預測點最準，之後逐步減弱。',
 '先確認真係一浪高過一浪（或低過一浪），浪頂浪底同步，先好畫——唔好為畫而畫。',
 '合理性：通道頂／底應同既有橫向支持阻力重疊；唔重疊就換 swing 點重畫。',
 '明確下跌趨勢中嘅向上突破，先懷疑係誘多陷阱（夾淡倉）。',
 '四巫日（3／6／9／12 月第三個星期五）成交量唔具參考價值。',
 '睇唔明沽空：將圖反轉，當做多咁分析。']},
{id:4,t:'移動平均線',src:'終極交易課程 EP4',mn:'均線唔可以單獨作入場理由，最少再加 1–2 個。',rel:[],pts:[
 '均線＝會郁嘅趨勢線，一樣係區間，突破後會角色互換。',
 '常用 10／20／50／200MA；輔助 63／150／250MA。SMA 同 EMA 一齊開，形成區間。',
 '冇「絕對重要」嘅均線：弱股跌到 200MA 唔係買點；強股可能只回 10／20MA。',
 '均線斜度＝趨勢力量；長線向上但 10／20MA 向下＝大方向冇變、短期回調。',
 '錯過突破唔使 FOMO：通常有 Second Chance 拉回。',
 '大升後橫行，未穿 200MA 而且整理 20–30% 內，可能只係消化升幅。',
 '冠軍錦囊：用利潤付風險；唔順手就減注；策略要配合市況。']},
{id:5,t:'M.E.T.A. 基礎：動能趨勢＋支持阻力',src:'終極交易課程 EP1',mn:'單一理由入場＝亂來；多重優勢疊加先係可靠交易。',rel:['bullflag','bearflag'],pts:[
 '散戶輸錢主因：入場只得單一理由，唔知自己有冇優勢。',
 '專業交易者勝率只得 40–55%，靠報酬風險比（例如 3:1）賺錢。',
 'M.E.T.A.＝多重優勢交易區：唔同策略嘅人喺同一位置一齊防守，合力更大。常見優勢：前浪頂阻力變支持、趨勢線、均線、低量拉回、突破小型 DTL。',
 '動能與趨勢：強勁趨勢大升細回、順勢放量、K 身少重疊、少碰 20MA（唔碰 10MA 最強）。',
 '支持與阻力：係區間、有記憶、會互換（Flipping）、測試越多越弱；止蝕放區間外。',
 '突破後回測（Back test）係正常；穿越後快速收返多數係陷阱（Shakeout）。',
 '高時間維度支持阻力凌駕低時間維度。',
 '追求時間效率：3 日賺 20% 好過 3 個月賺 20%。']},
{id:6,t:'拉回買入法 Pullback Buy',src:'Pullback Buy 完整教學',mn:'錯過突破唔追高，等重新突破小型下降趨勢線。',rel:['bullflag'],pts:[
 '錯過第一個突破點，等股價調整後重新突破「小型下降趨勢線」，係第二次低風險機會。',
 '只用喺第二階段上升（右側），最好早中期。',
 '等 Pullback Recovery（重新確認突破），唔好喺跌緊途中接。',
 '拉回時間越短越強（大資金急住補貨）。',
 '可用 4 小時／2 小時圖做放大鏡確認突破，突破前最好有小整固。',
 '止蝕放回調前低點下方，控制 8–10% 內，理想 5–6%。',
 '距突破點已超過 2–3%，冇特別理由唔追；VCP 突破後約一半機會會回調。']},
{id:7,t:'股市見底 8 大信號',src:'熊市 8 大入市信號',mn:'最好嘅入場唔係最低位，而係風險最低、最易賺錢嘅位置。',rel:[],pts:[
 '贏家只喺右側（升勢確認）入場；抄底係輸家行為。',
 '① 極端超賣（跳水式下跌）② 大力反彈 ③ 回測前低。',
 '④ 突破底部形態，一浪高過一浪。',
 '⑤ 10 週線（≈50 天線）升穿 40 週線（≈200 天線）⑥ 40 週線本身轉平或向上。',
 '⑦ 50／200 天線以上成分股比例大升（理想 70–90%）⑧ 大量個股出現低風險 Setup。',
 '單一訊號可能係假：2015 年 12 月嘅假交叉，只有約 26% 股票喺 50 天線上。']},
{id:8,t:'熊市保命＋多重確認預判',src:'避開股災預判方法',mn:'多個獨立方法指向同一位置，把握越大。',rel:[],pts:[
 'Confluence：量度升幅、週線 TRL、日線通道頂、時間週期、跨指數、歷史牛市長度，互相印證。',
 '市場會 Front Run 經濟數據，唔會等數據出咗先反應。',
 '牛市尾段降低進取，唔好喺情緒最高時用最大倉位；虧損後提防報復性交易。',
 '牛市熊市都有機會，但新手喺熊市可以 sit out 學習。',
 '「豬喺牛市熊市都會被劏」——貪心唔知進退最危險。']},
{id:9,t:'股市見頂 4 大訊號',src:'4 大見頂訊號',mn:'懂得走比懂得買重要。',rel:[],pts:[
 '① 出貨日：下跌（或升幅大幅收窄）日，成交量高過前一日同 50 天平均；2–4 週內 ≥4 個＝戒備。',
 '② 突兀走勢：單日波幅 ≥3% 大陰燭、跳空低開、全日單向跌。',
 '③ 背馳：指數創新高，但 50／200 天線以上成分股比例下降。',
 '④ 急漲性走勢（Climax Run）後，出現幾個月至一年最大單日跌幅＝最後逃生門。',
 '期貨結算日（3／6／9／12 月第三個星期五）唔計出貨日。',
 '唔用 RSI、MACD、OBV、保力加，只睇價格、成交量、趨勢。']},
{id:10,t:'套牢股票處理心法',src:'套牢股票點處理',mn:'每個買賣決定自己負全責。',rel:[],pts:[
 '唔好將決策責任外判畀「大師」、朋友或新聞。',
 '止蝕後反彈、或死抱後小反彈，都唔代表決定啱——唔好用單一結果歸因。',
 '任何 50% 跌幅都由 20% 開始，任何 90% 都由 50% 開始。',
 '死抱重傷股＝消耗購買力（機會成本），錯過真正翻身嘅股票。',
 '熊市最好持現金冬眠，等同大市背馳嘅領導股出現。']},
{id:11,t:'暴跌後谷底翻身',src:'4 招保命＋3 招翻身',mn:'保留購買力，先有資格翻身。',rel:[],pts:[
 '4 招保命：嚴守止蝕（單一股票最多 8%）→ 關掉消息 → 寫低失敗原因反覆回顧 → 冬眠。',
 '虧損越大回本越難：蝕 20% 要升 25%，蝕 50% 要升 100%。',
 '翻身①：找大市創新低時佢冇創新低、一浪高過一浪嘅「救命標的」。',
 '翻身②：同板塊「兄弟姐妹」都一樣強，先確認係真趨勢。',
 '翻身③：用 VCP／趨勢線抓準入場時機。',
 '跌市中跟大市一齊跌嘅「穩陣收息股」唔係救命股。',
 '「做多有時，做空有時，釣魚也有時。」']},
{id:12,t:'四階段分析',src:'Stan Weinstein',mn:'只喺第二階段做多；J Law 嘅 VCP、拉回買入都建基於此。',rel:[],pts:[
 '第一階段（築底）：股價圍繞走平嘅 30 週線（≈150 日線）上落，成交量萎縮。',
 '第二階段（上升）：放量突破底部，股價企喺向上嘅 30 週線之上——做多嘅主要階段。',
 '第三階段（見頂）：30 週線走平，股價反覆上落、波幅加大，成交量大但升唔上。',
 '第四階段（下跌）：跌穿 30 週線，30 週線向下——避開，唔好撈底。',
 'J Law 嘅 VCP、拉回買入只用喺第二階段；見頂 4 大訊號幫你察覺第三階段。',
 '注意：第二階段中段嘅橫行唔等於第三階段（J Law APP 案例）。']},
{id:13,t:'經典底部形態：杯柄／雙底／頭肩',src:'O\'Neil／Minervini',mn:'底部越扎實，突破越可靠；右側縮量、突破放量。',rel:['cup','dbot','ihs','hst','dtop'],pts:[
 'J Law 秘訣八：支持阻力之間形成底部（Base），有效突破後發展新趨勢。常見：VCP、杯柄、雙底、頭肩底、平台。',
 '杯柄：U 形杯，深度一般約 12–33%；柄喺杯嘅上半部形成，向下微傾、縮量；買點＝放量突破柄嘅高位。',
 '雙底（W）：第二個底最好輕微跌穿第一個底再收返（洗盤）；買點＝放量突破 W 中間高位。',
 '頭肩底：三個低位中間最低；突破頸線為買點，目標約＝頭部到頸線高度。頭肩頂相反，跌穿頸線偏淡。',
 '平台：大升後約 5 週以上、波幅 15% 以內嘅窄幅橫行。',
 '共通點：底部右側成交量收縮，突破時放量。']},
{id:14,t:'相對強度 RS',src:'RS（唔係 RSI）',mn:'跌市中抗跌嘅股票，往往係下一輪領導股。',rel:[],pts:[
 '相對強度（RS）＝股票表現同大市（例如 S&P 500）比較，同 RSI（超買超賣指標）完全唔同。',
 'RS 線＝股價 ÷ 指數；RS 線向上＝跑贏大市。',
 'RS 線比股價更早創新高，係領導股嘅常見訊號。',
 '調整市中跌得少、仲企喺 50MA 之上、冇創新低嘅股票＝相對強勢（J Law LPLA、騰訊例子）。',
 '同板塊多隻一齊強（「兄弟姐妹」）更可靠。',
 '實用做法：大市調整時記低邊幾隻抗跌，大市見底後優先睇佢哋有冇 VCP／M.E.T.A.。']},
{id:15,t:'量價關係',src:'量價基礎',mn:'價格話你去邊，成交量話你幾認真。',rel:['asc','bullflag'],pts:[
 '判斷放量／縮量要同近期平均比較（例如 50 日平均），唔好只同前一日比。',
 '有效突破：成交量最好高過平均約 40–50% 或以上。',
 '健康回調要縮量（J Law：低量拉回）；上升趨勢中放量下跌＝有人出貨。',
 '底部右側或 VCP 末段成交量「乾涸」，代表供應減少。',
 '大升後爆天量但升唔上，或急升後爆量大陰燭，係力竭訊號（見頂第 4 招）。',
 '四巫日、財報日嘅成交量會失真。']},
{id:16,t:'財報跳空與事件風險',src:'同你嘅訓練師指令一致',mn:'止蝕唔保證成交價——跳空可以直接跳過。',rel:[],pts:[
 '財報前後嘅跳空會令形態失真，唔可以當一般形態突破睇。',
 '跳空低開可以直接跳過止蝕位，實際虧損大過預期。',
 '常見做法：新倉位避免揸過財報，或者財報前減注；有足夠利潤軟墊先考慮持有。',
 '業績後放量跳空向上而唔回補（J Law Palantir、FSLR 案例）可以係強勁趨勢起點——等回測或 M.E.T.A. 先入。',
 '議息、CPI 等重大事件前後波幅加大，形態訊號可靠度下降。']},
{id:17,t:'交易心理與覆盤',src:'呼應 J Law 心法',mn:'用過程評分，唔好用單次結果評分。',rel:[],pts:[
 '好決定可以有壞結果，壞決定都可以撞啱：用「有冇跟計劃」評分。',
 'FOMO：錯過就等下一個機會（Second Chance／拉回買入），唔追。',
 '報復性交易：連續虧損後想即刻追返，係最危險嘅時候——減注或停手。',
 '交易日誌：記入場理由、截圖、優勢數目、出場原因、當時心情；定期覆盤搵重複犯嘅錯。',
 '入場前寫低「點樣會錯」——就係你喺呢度練緊嘅事前驗屍。',
 '唔順手減注、順手先進取（J Law 冠軍錦囊）。']},
{id:18,t:'實戰決策清單（形態以外）',src:'綜合 J Law 心法＋風險管理',mn:'形態只係入場理由之一；大市、確認、位置、事件、倉位決定你賺唔賺到錢。',rel:[],pts:[
 '次序好重要，由上至下逐項檢查：① 大市 ② 突破確認 ③ 事件風險 ④ 位置（追唔追） ⑤ 相對強度 ⑥ 倉位。',
 '① 大市：指數跌穿向下嘅 200MA（熊市）→ 唔做，持現金冬眠；指數喺 50MA 下、出貨日 ≥5（調整市）→ 減半注。',
 '② 確認：突破K收市企穩線外、成交量 ≥1.5 倍 20／50 日平均先算；縮量突破 → 等。',
 '③ 事件：財報 5 個交易日內 → 等財報後先入（跳空可以跳過止蝕）。',
 '④ 位置：現價離突破位超過約 3–5% → 唔追，等拉回或 Second Chance。',
 '⑤ RS：股票跑輸大市（RS 線向下）→ 減半注；調整市＋RS 弱 → 唔做。',
 '⑥ 倉位：股數＝帳戶 × 每單風險% ÷（入場 − 止蝕）；全注一般風險 1%，減半注 0.5%。',
 '管理：升到 +2R 賣部分、止蝕移成本；0–3 根 K 內跌返形態入面＝假突破跡象，離場；到止蝕就走，永不移低止蝕。',
 'RSI、MACD、分析師目標價、朋友貼士都係雜訊，唔改變決定。',
 '好決定可以蝕錢、壞決定可以撞啱：長遠只有「重複正確過程」先會令資金曲線向上。']}];

/* ================= 強勁趨勢辨識（EP1） ================= */
function genTrend(seed,strong){const R=mb(seed),rnd=(a,b)=>a+(b-a)*R(),bars=[],vb=rnd(.8,1.5)*1e6;let p=rnd(30,150);
 const add=(c,vm)=>{const o=bars.length?bars[bars.length-1].c:c,a=c*.011;bars.push({o,c,h:Math.max(o,c)+R()*a*.7,l:Math.min(o,c)-R()*a*.7,v:vb*vm*(.75+R()*.5)})};
 for(let i=0;i<55;i++){p*=Math.exp((R()-.5)*.02);add(p,1)}
 while(bars.length<135){if(strong){const nu=2+Math.floor(R()*5);for(let k=0;k<nu;k++){p*=1+rnd(.008,.02);add(p,rnd(1.4,2))}const nd=1+Math.floor(R()*2);for(let k=0;k<nd;k++){p*=1-rnd(.003,.009);add(p,.6)}}
  else{const nu=3+Math.floor(R()*4);for(let k=0;k<nu;k++){p*=1+rnd(.007,.015);add(p,1.05)}const nd=3+Math.floor(R()*4);for(let k=0;k<nd;k++){p*=1-rnd(.004,.012);add(p,1)}}}
 bars.length=135;const cl=bars.map(b=>b.c),m10=sma(cl,10),m20=sma(cl,20),m50=sma(cl,50);let t20=0,uv=0,dv=0,un=0,dn=0;
 for(let i=60;i<135;i++){if(bars[i].l<=m20[i])t20++;if(bars[i].c>=bars[i].o){uv+=bars[i].v;un++}else{dv+=bars[i].v;dn++}}
 return{bars,m10,m20,m50,strong,t20,vr:(uv/Math.max(1,un))/(dv/Math.max(1,dn)),up:un,gain:(bars[134].c/bars[55].c-1)*100}}
function genTrendOk(seed,strong){let t;for(let a=0;a<40;a++){t=genTrend(seed+a*7919,strong);if(strong?t.gain>40:(t.gain>8&&t.gain<40&&t.t20>=8))return t}return t}
function drawTrend(cv,t,reveal){const css=getComputedStyle(document.documentElement),cv2=n=>css.getPropertyValue(n).trim();
 const P=plot(cv,t.bars,25,135,110,{h:400,mas:[{a:t.m10,c:'#2e7d32',t:'10MA'},{a:t.m20,c:cv2('--res')||'#e65100',t:'20MA'},{a:t.m50,c:cv2('--user')||'#8e24aa',t:'50MA'}]});
 if(reveal){const{g,X,Y}=P;g.fillStyle=cv2('--bad')||'#c62828';for(let i=60;i<135;i++)if(t.bars[i].l<=t.m20[i]){g.beginPath();g.arc(X(i),Y(t.bars[i].l)+6,3,0,7);g.fill()}}}

 CUR={L:left,R:right,ask,done:false};
 view(`<div class="card">${back}<div class="tags"><span class="tag">🚀 強勁趨勢 ${SES.n+1}/${SES.total}</span><span class="tag sim">模擬教學圖</span></div>
 <h2>邊幅係${ask==='strong'?'「強勁趨勢」':'「一般趨勢」'}？</h2><p class="small">J Law：強勁趨勢大升細回、順勢放量、K 身少重疊、好少碰 20MA。綠＝10MA、橙＝20MA、紫＝50MA。鍵盤 A／B。</p>
 <div class="pair"><div><div class="plabel" id="lA">圖 A</div><canvas id="cvA"></canvas><button id="bA">揀 A</button></div><div><div class="plabel" id="lB">圖 B</div><canvas id="cvB"></canvas><button id="bB">揀 B</button></div></div><div id="fb"></div></div>`);
 drawTrend($('cvA'),left,false);drawTrend($('cvB'),right,false);on('bA',()=>ansTrend('A'));on('bB',()=>ansTrend('B'));
 KEYH=e=>{const x=e.key.toLowerCase();if(!CUR.done&&(x==='a'||x==='1'))ansTrend('A');else if(!CUR.done&&(x==='b'||x==='2'))ansTrend('B');else if(CUR.done&&e.key==='Enter'){SES.n++;nextTrend()}}}

 S.trendH.push(ok?1:0);if(S.trendH.length>200)S.trendH.shift();bump(S.lstat,5,ok);review('M:trend',ok?4:1);tick();save();SES.res.push(ok?1:0);SES.max.push(1);
 drawTrend($('cvA'),CUR.L,true);drawTrend($('cvB'),CUR.R,true);$('bA').disabled=$('bB').disabled=true;
 const d=x=>`${x.strong?'強勁趨勢':'一般趨勢'}｜升 ${x.gain.toFixed(0)}%｜碰 20MA ${x.t20} 次｜升日量 ÷ 跌日量 ${x.vr.toFixed(2)}`;
 $('lA').textContent='圖 A：'+d(CUR.L);$('lB').textContent='圖 B：'+d(CUR.R);
 $('fb').innerHTML=`<p class="${ok?'ok':'bad'}">${ok?'✔ 正確':'✘ 錯咗'}</p><div class="jlbox">紅點＝低位碰到 20MA。強勁趨勢好少碰 20MA、升日成交量明顯大過跌日、回調只有一兩日；一般趨勢升跌日數差唔多，成日碰 20MA 甚至 50MA。<br>J Law：同一隻股，強勁趨勢用一半時間就賺到同樣回報——所以只交易強勁趨勢，再等低量拉回到 10／20MA 嘅 M.E.T.A. 先入，唔追高。</div><button id="nx">下一題 ⏎</button>`;
 on('nx',()=>{SES.n++;nextTrend()})}
