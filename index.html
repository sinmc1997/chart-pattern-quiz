<!DOCTYPE html>
<html lang="zh-HK"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>形態訓練營</title>
<style>
:root{--bg:#f4f6f8;--card:#fff;--fg:#1f2328;--muted:#667080;--line:#d0d7de;--accent:#1565c0;--accent-fg:#fff;--accent-weak:#e3f2fd;--alt:#78909c;--ok:#0a7d32;--ok-bg:#e8f5e9;--bad:#c62828;--bad-bg:#ffebee;--warn:#f9a825;--warn-bg:#fff8e1;--tag:#e8eaf6;--tag-fg:#283593;--sim:#e65100;--sim-bg:#fff3e0;--hl:#6a1b9a;--hl-bg:#f3e5f5;--chart-bg:#fff;--chart-grid:#eee;--chart-axis:#777;--res:#e65100;--sup:#1565c0;--user:#8e24aa;--shadow:0 1px 3px #0002}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1216;--card:#181c22;--fg:#e6e8eb;--muted:#9aa4b2;--line:#2e3540;--accent:#4c8dff;--accent-weak:#1c2a44;--alt:#4a5868;--ok:#5cc463;--ok-bg:#16301b;--bad:#ff6b66;--bad-bg:#3a1a1a;--warn:#f9a825;--warn-bg:#332a10;--tag:#252b45;--tag-fg:#b8c2ff;--sim:#ffb074;--sim-bg:#3a2510;--hl:#d6a8f5;--hl-bg:#2e1d3a;--chart-bg:#12161b;--chart-grid:#232a33;--chart-axis:#8b95a3;--res:#ff9e57;--sup:#64a8ff;--user:#e07bff;--shadow:0 1px 3px #0008}}
:root[data-theme="dark"]{--bg:#0f1216;--card:#181c22;--fg:#e6e8eb;--muted:#9aa4b2;--line:#2e3540;--accent:#4c8dff;--accent-weak:#1c2a44;--alt:#4a5868;--ok:#5cc463;--ok-bg:#16301b;--bad:#ff6b66;--bad-bg:#3a1a1a;--warn:#f9a825;--warn-bg:#332a10;--tag:#252b45;--tag-fg:#b8c2ff;--sim:#ffb074;--sim-bg:#3a2510;--hl:#d6a8f5;--hl-bg:#2e1d3a;--chart-bg:#12161b;--chart-grid:#232a33;--chart-axis:#8b95a3;--res:#ff9e57;--sup:#64a8ff;--user:#e07bff;--shadow:0 1px 3px #0008}
*{box-sizing:border-box}
body{font-family:-apple-system,"PingFang HK","Microsoft JhengHei",sans-serif;margin:0;background:var(--bg);color:var(--fg);line-height:1.55}
main{max-width:860px;margin:auto;padding:12px 16px 40px}
.card{background:var(--card);border-radius:12px;padding:14px 16px;margin:10px 0;box-shadow:var(--shadow)}
h1{font-size:21px;margin:6px 0}h2{font-size:19px;margin:6px 0}h3{font-size:16px;margin:14px 0 6px}
.tags{display:flex;flex-wrap:wrap;gap:4px;align-items:center;margin-bottom:6px}
.tag{display:inline-block;background:var(--tag);color:var(--tag-fg);border-radius:12px;padding:1px 10px;font-size:12px}
.tag.sim{background:var(--sim-bg);color:var(--sim)}.tag.hl{background:var(--hl-bg);color:var(--hl);font-weight:bold}
button{background:var(--accent);color:var(--accent-fg);border:0;border-radius:8px;padding:10px 16px;font-size:15px;cursor:pointer;margin:4px 4px 4px 0;font-family:inherit}
button.alt{background:var(--alt);color:#fff}button.sm{padding:5px 11px;font-size:13px}button:disabled{opacity:.5;cursor:default}
.opt{display:block;border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin:5px 0;cursor:pointer}
.opt:has(input:checked){background:var(--accent-weak);border-color:var(--accent)}
.guess{display:inline-flex;gap:4px;align-items:center;font-size:12px;color:var(--muted);cursor:pointer;margin:2px 0 4px;padding:2px 8px;border:1px dashed var(--line);border-radius:12px}
.guess:has(input:checked){color:var(--hl);border-color:var(--hl);background:var(--hl-bg)}
textarea{width:100%;height:64px;font-size:14px;font-family:inherit;background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:6px}
select{font-size:14px;padding:4px;background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:6px}
table{border-collapse:collapse;width:100%;font-size:13px;margin:6px 0}td,th{border:1px solid var(--line);padding:5px;vertical-align:top}th{background:var(--accent-weak);text-align:left}
.ok{color:var(--ok);font-weight:bold}.bad{color:var(--bad);font-weight:bold}
.warn{background:var(--warn-bg);border-left:4px solid var(--warn);padding:8px 10px;margin:8px 0;border-radius:4px}
.badbox{background:var(--bad-bg);border-left:4px solid var(--bad);padding:8px 10px;margin:8px 0;border-radius:4px}
.okbox{background:var(--ok-bg);border-left:4px solid var(--ok);padding:8px 10px;margin:8px 0;border-radius:4px}
.warn ul,.badbox ul{margin:4px 0;padding-left:20px}
tr.blind td{background:var(--bad-bg)}
.small{font-size:12px;color:var(--muted)}
canvas{width:100%;display:block;border:1px solid var(--line);border-radius:6px}
.q{border-top:1px dashed var(--line);padding-top:8px;margin-top:8px}
.cvwrap{position:relative}
.cover{position:absolute;inset:0;background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:22px;border-radius:6px;border:1px solid var(--line)}
.cover[hidden]{display:none}
.tbar{height:4px;background:var(--accent);border-radius:2px;margin:4px 0;width:100%}
.nameopts{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px;margin:8px 0}
.nameopts button{margin:0;background:var(--card);color:var(--fg);border:1px solid var(--line)}
.nameopts button:disabled{opacity:.55}.nameopts button.right,.nameopts button.wrong{opacity:1}
.nameopts button.right{background:var(--ok-bg);border-color:var(--ok);color:var(--ok);font-weight:bold}
.nameopts button.wrong{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;margin:10px 0}
.mode{background:var(--card);border-radius:12px;padding:12px 14px;box-shadow:var(--shadow);cursor:pointer;border:1px solid transparent}
.mode:hover{border-color:var(--accent)}.mode b{font-size:16px}.mode p{margin:4px 0 0;font-size:13px;color:var(--muted)}
.stats4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center;margin:10px 0 6px}
.stats4 b{display:block;font-size:20px}.stats4 span{font-size:12px;color:var(--muted)}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ok)}
.mbar{display:inline-block;width:90px;height:8px;background:var(--line);border-radius:4px;overflow:hidden;vertical-align:middle;margin-right:6px}.mbar i{display:block;height:100%}
.rec{display:block;width:100%;text-align:left;background:var(--card);color:var(--fg);border:1px solid var(--line);margin:6px 0}
.rec.main{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.rec span{display:block;font-size:12px;opacity:.8;margin-top:2px}
.path li{margin:3px 0}.path .done{color:var(--ok)}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:640px){.pair{grid-template-columns:1fr}.grid{grid-template-columns:1fr 1fr;gap:8px}.mode{padding:10px}.mode b{font-size:15px}.stats4 b{font-size:17px}}
.plabel{font-weight:bold;margin:4px 0}
.sch{width:100%;max-width:180px;height:auto;display:block;background:var(--chart-bg);border:1px solid var(--line);border-radius:6px}
.lgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.lcard{background:var(--card);border-radius:10px;padding:10px;box-shadow:var(--shadow);cursor:pointer;border:1px solid transparent}.lcard:hover{border-color:var(--accent)}
.mn{background:var(--hl-bg);color:var(--hl);padding:6px 10px;border-radius:8px;font-weight:bold}
.answer p{margin:6px 0}
.rate{display:flex;flex-wrap:wrap;gap:4px}
.scroll{overflow-x:auto}
table.cm td,table.cm th{text-align:center;padding:4px;min-width:34px}
.spark{width:100%;max-width:420px;height:70px;display:block}
.srs{font-size:13px;background:var(--accent-weak);padding:6px 10px;border-radius:8px;margin:8px 0}
.drawhelp{font-weight:bold;color:var(--user);margin:6px 0}
details summary{cursor:pointer;font-weight:bold}
.set label{display:block;margin:6px 0}
</style></head><body><main id="app"></main>
<script>
/* ================= 形態資料 ================= */
const PATTERNS={
asc:{cat:'三角形',name:'上升三角形',s:'升三',pre:1,bias:1,up:'水平',lo:'上傾',shape:'收窄',pole:0,mn:'頂平・底升 → 買家逼爆天花板',
 feat:'上方水平阻力線＋下方上傾支持線，各觸至少 2 次，成交量逐步收縮。',
 pr:'買家較急：每次回調都肯用更高價接貨（上傾支持線＝需求），賣家卻只守住同一價位（水平阻力線＝供給），供給被逐步吃掉。',
 fail:'假突破：突破水平阻力時成交量不足，其後跌回三角形內'},
desc:{cat:'三角形',name:'下降三角形',s:'降三',pre:-1,bias:-1,up:'下傾',lo:'水平',shape:'收窄',pole:0,mn:'底平・頂降 → 賣家壓穿地板',
 feat:'下方水平支持線＋上方下傾阻力線，各觸至少 2 次，量縮。',
 pr:'賣家較急：每次反彈都肯用更低價沽出（下傾阻力線＝供給），買家只守住同一價位（水平支持線＝需求），需求被逐步耗盡。',
 fail:'假跌破：跌穿水平支持時縮量，之後被買家拉回形態內（空頭陷阱）'},
sym:{cat:'三角形',name:'對稱三角形',s:'對三',pre:0,bias:0,up:'下傾',lo:'上傾',shape:'收窄',pole:0,mn:'上壓・下托 → 兩邊夾實，等邊方爆',
 feat:'上軌下傾、下軌上傾，波幅收窄；本身中性，等收市突破。',
 pr:'買賣雙方都未肯讓步：賣家逐步壓低（下傾阻力線＝供給）、買家逐步抬高（上傾支持線＝需求），波幅收窄，等一方撐不住。',
 fail:'突破方向與預期相反：對稱三角形本身中性，太早押注一方'},
bullflag:{cat:'旗形',name:'牛旗',s:'牛旗',pre:1,bias:1,up:'下傾',lo:'下傾',shape:'平行',pole:1,mn:'急升旗桿＋細細下傾旗 → 歇完再升',
 feat:'急升旗桿後，出現細幅、下傾、大致平行的通道，量縮。',
 pr:'急升後買家只是歇一歇：賣家小幅獲利回吐，令價格沿下傾通道緩跌，但縮量顯示沽壓不大，買家仍然較急。',
 fail:'回調太深太長，牛旗變成轉向（回吐超過旗桿約一半）'},
bearflag:{cat:'旗形',name:'熊旗',s:'熊旗',pre:-1,bias:-1,up:'上傾',lo:'上傾',shape:'平行',pole:1,mn:'急跌旗桿＋細細上傾旗 → 抖完再跌',
 feat:'急跌旗桿後，出現細幅、上傾、大致平行的通道，量縮。',
 pr:'急跌後賣家只是歇一歇：買家小幅反彈令價格沿上傾通道上移，但縮量代表買盤弱，賣家仍然較急。',
 fail:'反彈太強太久，熊旗變成轉向（反彈超過旗桿約一半）'},
rw:{cat:'楔形',name:'上升楔形',s:'升楔',pre:1,bias:-1,up:'上傾',lo:'上傾',shape:'收窄',pole:0,mn:'兩線都升但收窄 → 愈升愈攰，向下破',
 feat:'兩條線都向上但收窄（下軌比上軌斜），每次升幅遞減，量縮；偏向下破。',
 pr:'價格雖升但買家愈追愈乏力（升幅愈來愈細），賣家在上方逐步增加，上升動力衰竭。',
 fail:'跌穿下軌時未放量，其後反彈再創新高（楔形延伸）'},
fw:{cat:'楔形',name:'下降楔形',s:'降楔',pre:-1,bias:1,up:'下傾',lo:'下傾',shape:'收窄',pole:0,mn:'兩線都跌但收窄 → 愈跌愈攰，向上破',
 feat:'兩條線都向下並收窄（上軌比下軌斜），每次跌幅遞減，量縮；偏向上破。',
 pr:'價格雖跌但賣家愈沽愈乏力（跌幅收窄），買家在下方逐步承接，下跌動力衰竭。',
 fail:'未放量突破上軌就入場，價格再創新低'}};
const PK=Object.keys(PATTERNS);
const GEN_FAIL=['止蝕設得太近，被正常波動掃走','大市或消息面突然逆向，令形態失效','前段趨勢其實已轉向，形態只係中途喘息'];
const HARD_FAIL='假突破：突破K線縮量、未獲確認，價格隨後跌回形態內';
const ITEMS=['形態名稱','第一性原理','偏向','入場條件','止蝕','目標價','最可能出錯原因'];
const DRILL=['練習：用 3 張圖只問「幾條線？邊條平？邊條斜？」，先分類再命名。','練習：每個形態用一句「邊方較急／邊條線係供給或需求」講出來，再對答案。','練習：只睇前段趨勢＋形態斜率，講出偏向，唔好睇答案走勢。','練習：寫低「收市價＋成交量」兩個確認條件，重做 3 題高級假突破。','練習：止蝕一律放形態對側軌道外，計算與入場價的百分比距離。','練習：三角形量最闊位、旗形量旗桿、楔形回到起點，各量一次。','練習：每題先寫「呢單點樣會輸」，對照形態常見失敗模式。'];
const LV={1:'初級',2:'中級',3:'高級（含假突破）'};
const SIMILAR={asc:['sym','rw'],desc:['sym','fw'],sym:['asc','desc'],bullflag:['fw','bearflag'],bearflag:['rw','bullflag'],rw:['asc','bearflag'],fw:['desc','bullflag']};
const PAIRS=[['asc','rw'],['asc','sym'],['desc','fw'],['desc','sym'],['bullflag','fw'],['bearflag','rw'],['rw','fw'],['bullflag','bearflag'],['asc','desc']];
const biasTxt=b=>b>0?'偏向上破（看漲）':b<0?'偏向下破（看淡）':'中性（等突破方向）';
const methOf=P=>P.cat==='三角形'?'三角形最闊位高度，由突破位起計':P.cat==='旗形'?'旗桿高度，由突破位起計':'回到楔形起點';
function diffTip(a,b){const A=PATTERNS[a],B=PATTERNS[b],o=[];
 if(A.up!==B.up)o.push(`上軌：「${A.name}」係<b>${A.up}</b>，「${B.name}」係<b>${B.up}</b>`);
 if(A.lo!==B.lo)o.push(`下軌：「${A.name}」係<b>${A.lo}</b>，「${B.name}」係<b>${B.lo}</b>`);
 if(A.shape!==B.shape)o.push(`兩條線：「${A.name}」<b>${A.shape}</b>，「${B.name}」<b>${B.shape}</b>`);
 if(A.pole!==B.pole){const[y,n]=A.pole?[A,B]:[B,A];o.push(`「${y.name}」之前一定有<b>急速旗桿</b>，形態亦較短；「${n.name}」唔需要旗桿`)}
 if(A.bias!==B.bias)o.push(`偏向：「${A.name}」${biasTxt(A.bias)}；「${B.name}」${biasTxt(B.bias)}`);
 return o}
const diffBox=(a,b)=>`<div class="warn"><b>點樣分辨「${PATTERNS[a].name}」同「${PATTERNS[b].name}」</b><ul>${diffTip(a,b).map(x=>'<li>'+x+'</li>').join('')}</ul></div>`;

/* 示意圖（雙重編碼：文字＋圖像） */
const SCHEM={asc:{u:[15,20,85,20],l:[15,66,85,24]},desc:{u:[15,14,85,56],l:[15,60,85,60]},sym:{u:[15,10,85,37],l:[15,68,85,41]},
 bullflag:{pole:[4,74,30,16],u:[30,16,86,32],l:[30,32,86,48]},bearflag:{pole:[4,6,30,64],u:[30,48,86,32],l:[30,64,86,48]},
 rw:{u:[15,40,85,12],l:[15,72,85,20]},fw:{u:[15,8,85,60],l:[15,40,85,68]}};
function schem(k){const s=SCHEM[k],P=PATTERNS[k],li=(a,b,t)=>a+(b-a)*t,uy=t=>li(s.u[1],s.u[3],t),ly=t=>li(s.l[1],s.l[3],t),x0=s.u[0],x1=s.u[2],n=6,startLow=k==='bearflag';
 const pts=[];if(s.pole)pts.push([s.pole[0],s.pole[1]]);for(let i=0;i<=n;i++){const t=i/n,low=(i%2===1)!==startLow;pts.push([li(x0,x1,t),low?ly(t):uy(t)])}
 const ex=x1+1,mid=(uy(1)+ly(1))/2,arr=d=>`<line x1="${ex}" y1="${mid}" x2="${ex+9}" y2="${mid-d*16}" stroke="var(--fg)" stroke-width="2" marker-end="url(#ah${k})" ${P.bias===0?'stroke-dasharray="2 2"':''}/>`;
 return `<svg class="sch" viewBox="0 0 100 80" aria-label="${P.name}示意圖"><defs><marker id="ah${k}" markerWidth="6" markerHeight="6" refX="3" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="var(--fg)"/></marker></defs>
 <line x1="${s.u[0]}" y1="${s.u[1]}" x2="${s.u[2]}" y2="${s.u[3]}" stroke="var(--res)" stroke-width="2"/><line x1="${s.l[0]}" y1="${s.l[1]}" x2="${s.l[2]}" y2="${s.l[3]}" stroke="var(--sup)" stroke-width="2"/>
 <polyline points="${pts.map(p=>p.map(v=>v.toFixed(1)).join(',')).join(' ')}" fill="none" stroke="var(--muted)" stroke-width="1.6"/>${P.bias===0?arr(1)+arr(-1):arr(P.bias)}</svg>`}

/* ================= 圖表生成（seed 決定，可重現） ================= */
function mb(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function shuf(R,a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(R()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const cl=(x,a,b)=>Math.max(a,Math.min(b,x));
const rs=()=>Math.floor(Math.random()*4e9);
function genScenario(key,level,seed){
 const P=PATTERNS[key],R=mb(seed),rnd=(a,b)=>a+(b-a)*R(),bars=[];
 let p=rnd(40,160);const p0=p,vb=rnd(.8,1.3)*1e6,pd=key==='sym'?(R()<.5?1:-1):P.pre,atr0=p*.014,pole=key==='bullflag'||key==='bearflag',nz={1:.7,2:1,3:1.3}[level];
 const add=(o,c,vm,atr)=>bars.push({o,c,h:Math.max(o,c)+R()*atr*.5,l:Math.min(o,c)-R()*atr*.5,v:vb*vm*(.8+R()*.4)});
 let poleH=0,preDesc,preN;
 if(pole){for(let i=0;i<8;i++){const o=p,c=o+(R()-.5)*atr0*1.2;add(o,c,.8,atr0);p=c}
  const s0=p,tot=p0*.18*(level===1?1.1:level===2?1:.9);
  for(let i=0;i<8;i++){const o=p,c=o+pd*tot/8+(R()-.5)*atr0*.4*nz;add(o,c,2,atr0*1.2);p=c}
  poleH=Math.abs(p-s0);preN=16;preDesc=(pd>0?'急速上升':'急速下跌')+'（旗桿約 '+(poleH/s0*100).toFixed(0)+'%，8 根）'}
 else{const tot=pd*p0*({1:.16,2:.13,3:.10}[level]);for(let i=0;i<18;i++){const o=p,c=o+tot/18+(R()-.5)*atr0*1.6*nz;add(o,c,1,atr0);p=c}
  preN=18;preDesc=key==='sym'?(pd>0?'上升':'下跌')+'（約 '+(tot/p0*100).toFixed(0)+'%，18 根）':(pd>0?'上升':'下跌')+'（約 '+Math.abs(tot/p0*100).toFixed(0)+'%，18 根）'}
 const ps=p,M=pole?14:26,atr=ps*.012,W0=ps*(key==='rw'||key==='fw'?.08:.09),Wf=ps*.045,drop=poleH*.35,cv=i=>.92*i/(1.1*M);
 let U,Lw;

 <h3>形態掌握度</h3><div class="scroll"><table><tr><th>形態</th><th>掌握度（Elo）</th><th>做題準確</th><th>下次複習</th></tr>${PK.map(k=>{const c=S.cards['P:'+k],ds=['P:','F:','D:','L:'].map(p=>S.cards[p+k]).filter(x=>x&&x.seen).map(x=>x.due);return`<tr><td>${PATTERNS[k].name}</td><td>${mbar(mastery(k))} <span class="small">(${rating(k)})</span></td><td>${c&&c.seen?Math.round(c.ok/c.seen*100)+'%（'+c.seen+'）':'—'}</td><td>${ds.length?fmtDue(Math.min(...ds)):'未開始'}</td></tr>`}).join('')}</table></div>
 <h3>七項分析準確率</h3><table><tr>${ITEMS.map(x=>`<th>${x}</th>`).join('')}</tr><tr>${ITEMS.map((x,i)=>`<td>${pct(S.items[i])}</td>`).join('')}</tr></table>
 ${weakPI.length?`<p class="small"><b>最弱組合</b>：${weakPI.slice(0,3).map(x=>`${PATTERNS[x.k].name}・${ITEMS[x.it]}（${Math.round(x.a*100)}%）`).join('、')}</p>`:''}
 <h3>🎯 信心校準</h3><p>肯定作答準確率：<b>${pct(cs)}</b>（${cs.n} 項）　｜　🎲 估嘅準確率：<b>${pct(cg)}</b>（${cg.n} 項）</p>
 <p class="small">${cs.n>=14?(cs.ok/cs.n<.8?'⚠️ 你「肯定」嘅答案準確率低過 80%，有啲過度自信：唔肯定時記得剔「估」，或者先用提示。':'👍 你嘅信心大致準確。'):'做多幾題先有足夠數據。'}</p>
 <h3>⚖️ 混淆矩陣</h3>${confTable()}
 <h3>📈 最近 ${H.length} 題得分</h3>${spark(H.map(h=>h.s),7)}
 <h3>⚡ 快閃</h3><p>最近 ${F.length} 題準確率 ${F.length?fa+'%':'—'}，平均 ${frt} 秒；目前顯示時間 ${(st.flashMs/1000).toFixed(2)} 秒</p></div>
 <div class="card set"><h2>⚙️ 設定</h2>
 <label><input type="checkbox" id="s_pm" ${st.premortem?'checked':''}> 作答前要寫「事前驗屍」</label>
 <label>每日目標：<select id="s_goal">${opt(st.goal,[5,10,15,20,30],' 題')}</select></label>
 <label>智能練習每輪：<select id="s_rl">${opt(st.roundLen,[3,5,8,10],' 題')}</select></label>
 <label><input type="checkbox" id="s_fa" ${st.flashAuto?'checked':''}> 快閃顯示時間自動調節</label>
 <label>快閃顯示時間：<select id="s_fm">${[1500,2000,3000,4000,5000,6000].map(x=>`<option value="${x}" ${Math.abs(st.flashMs-x)<250?'selected':''}>${x/1000} 秒</option>`).join('')}</select></label>
 <label>外觀：<select id="s_th"><option value="auto" ${st.theme==='auto'?'selected':''}>跟系統</option><option value="light" ${st.theme==='light'?'selected':''}>淺色</option><option value="dark" ${st.theme==='dark'?'selected':''}>深色</option></select></label>
 <button id="sv">儲存設定</button><span id="svm" class="ok"></span>
 <h3>資料</h3><p class="small">紀錄只存喺呢部機嘅瀏覽器。換機前可以匯出，喺新機匯入。</p>
 <button class="alt" id="ex">⬇️ 匯出進度</button><label class="alt" style="display:inline-block;background:var(--alt);color:#fff;border-radius:8px;padding:10px 16px;cursor:pointer">⬆️ 匯入進度<input type="file" id="im" accept="application/json" hidden></label>
 <button class="alt" id="rs" style="background:var(--bad)">清除所有紀錄</button><p id="imm" class="small"></p></div>`);
 on('sv',()=>{st.premortem=$('s_pm').checked;st.goal=+$('s_goal').value;st.roundLen=+$('s_rl').value;st.flashAuto=$('s_fa').checked;st.flashMs=+$('s_fm').value;st.theme=$('s_th').value;save();applyTheme();$('svm').textContent=' ✔ 已儲存'});
 on('ex',()=>{const b=new Blob([JSON.stringify(S)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='pattern-progress-'+today()+'.json';document.body.appendChild(a);a.click();a.remove()});
 $('im').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const s=JSON.parse(r.result);if(!s||s.ver!==2||!s.cards)throw 0;LS.set(KEY,JSON.stringify(s));S=null;load();statsView();$('imm').textContent='✔ 匯入成功'}catch(err){$('imm').textContent='✘ 檔案格式唔啱'}};r.readAsText(f)};
 on('rs',()=>{if(confirm('確定清除所有紀錄？（無法復原）')){LS.del(KEY);LS.del(OLD);S=fresh();save();home()}})}

/* ================= 啟動 ================= */
if(typeof document!=='undefined'&&document.getElementById('app'))home();
if(typeof module!=='undefined')module.exports={genScenario,buildQs,drawChart,PATTERNS,diffTip,review,chooseLevel,expect,mastery,_setS:s=>{S=s}};
</script></body></html>
