 let p=rnd(40,160);const p0=p,vb=rnd(.8,1.3)*1e6,pd=key==='sym'?(R()<.5?1:-1):P.pre,atr0=p*.014,pole=key==='bullflag'||key==='bearflag',nz={1:.7,2:1,3:1.3}[level];

function buildQs(sc,seed){

 else{er=hard?`最後一支突破K線成交量偏低，未算確認；等放量收市企穩${ln}之外，或回測不破才${act}`:`收市價有效突破${ln}，並伴隨成交量明顯放大，才${act}`;

const KEY='patternMC_v1';let S;
function load(){try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}S=S||{weak:{},items:{},hist:[],last:null,level:1};S.items=S.items||{};}

let RD=null,CUR=null;const $=s=>document.getElementById(s),app=()=>$('app');
function pick(cat){const ks=Object.keys(PATTERNS).filter(k=>PATTERNS[k].cat===cat),due=ks.filter(k=>S.weak[k]&&S.weak[k].due<=0).sort((a,b)=>S.weak[b].wrong-S.weak[a].wrong);
 if(due.length)return{k:due[0],rev:1};const c=ks.filter(k=>k!==RD.lastBy[cat]);return{k:c[Math.floor(Math.random()*c.length)],rev:0}}
function startRound(level){S.level=level;let cats=['三角形','旗形','楔形'].sort(()=>Math.random()-.5);if(cats[0]===S.last)cats.push(cats.shift());RD={level,cats,n:0,res:[],lastBy:RD?RD.lastBy:{}};nextQ()}
function nextQ(){const cat=RD.cats[RD.n],p=pick(cat),seed=Math.floor(Math.random()*4e9);RD.lastBy[cat]=p.k;const sc=genScenario(p.k,RD.level,seed);CUR={sc,qs:buildQs(sc,seed),rev:p.rev};renderQ()}
function home(){load();const w=Object.entries(S.weak),it=Object.entries(S.items).filter(([k,v])=>v.w>0).sort((a,b)=>b[1].w-a[1].w);
 app().innerHTML=`<div class="card"><h1>📈 形態 MC 練習</h1><p>三角形・旗形・楔形｜每輪 3 題，三類交錯，錯咗隔幾題再出現。</p>

 <h3>揀難度</h3><button data-l="1">初級</button><button data-l="2">中級</button><button data-l="3">高級（含假突破）</button></div>

 ${it.length?'<p class="small">項目錯誤：'+it.map(([k,v])=>`${ITEMS[k]} ${v.w}/${v.t}`).join('、')+'</p>':''}

 document.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>startRound(+b.dataset.l));$('rs').onclick=()=>{if(confirm('確定清除？')){localStorage.removeItem(KEY);home()}}}
function renderQ(){const{sc,qs}=CUR;
 app().innerHTML=`<div class="card"><span class="tag">第 ${RD.n+1}/3 題</span><span class="tag">${LV[RD.level]}</span><span class="tag sim">模擬教學圖</span>${CUR.rev?'<span class="tag">間隔重溫</span>':''}
 <p><b>市場</b>：SIM-${String.fromCharCode(65+Math.floor(Math.random()*26))}（模擬股票）　<b>時間框架</b>：日線　<b>前段趨勢</b>：${sc.preDesc}</p>
 <canvas id="cv"></canvas><p class="small">圖已截於形態尾部，後續走勢隱藏。${sc.hard?'留意最後一支K線同成交量。':''}</p>
 <h3>① 防事後孔明：先寫「我呢個判斷可能錯在邊」</h3><textarea id="why" placeholder="例如：我可能誤將對稱三角形當成上升三角形…"></textarea>
 <h3>② 作答（7 項，每項 1 分）</h3>${qs.map((q,i)=>`<div class="q"><b>${i+1}. ${ITEMS[q.it]}</b>：${q.p}${q.o.map((o,j)=>`<label class="opt"><input type="radio" name="q${i}" value="${j}"> ${o.t}</label>`).join('')}</div>`).join('')}
 <p id="msg" class="bad"></p><button id="sub">提交批改</button></div>`;
 drawChart($('cv'),sc,false);
 $('sub').onclick=()=>{const why=$('why').value.trim();if(why.length<4){$('msg').textContent='請先完成①：寫低你覺得可能錯在邊。';return}
  const ans=qs.map((q,i)=>{const r=document.querySelector(`input[name=q${i}]:checked`);return r?+r.value:-1});if(ans.includes(-1)){$('msg').textContent='仲有項目未答（第 '+(ans.indexOf(-1)+1)+' 項）。';return}grade(ans,why)}}
function grade(ans,why){const{sc,qs}=CUR;let tot=0;const rows=qs.map((q,i)=>{const ok=q.o[ans[i]].ok;tot+=ok?1:0;return{q,ok,u:q.o[ans[i]].t,c:q.o.find(o=>o.ok).t}});
 Object.values(S.weak).forEach(w=>{if(w.due>0)w.due--});

 else if(S.weak[k]){const w=S.weak[k];w.streak++;if(w.streak>=2)delete S.weak[k]}
 S.last=RD.cats[RD.n];S.hist.push({t:Date.now(),k,lv:RD.level,s:tot});save();RD.res.push(tot);
 const bad=rows.find(r=>!r.ok);
 app().innerHTML=`<div class="card"><span class="tag">第 ${RD.n+1}/3 題</span><span class="tag sim">模擬教學圖</span><h1>得分 ${tot}/7　${sc.P.name}</h1>

 <table><tr><th>項目</th><th>你揀</th><th>正解</th><th>分</th></tr>${rows.map(r=>`<tr><td>${ITEMS[r.q.it]}</td><td>${r.u}</td><td>${r.c}</td><td class="${r.ok?'ok':'bad'}">${r.ok?'✔ 1':'✘ 0'}</td></tr>`).join('')}</table>
 <div class="warn"><b>你事前寫嘅風險</b>：${why.replace(/</g,'&lt;')}<br>對照本形態常見失敗：${sc.hard?HARD_FAIL:sc.P.fail}</div>
 ${bad?`<p><b>最關鍵錯誤</b>：${ITEMS[bad.q.it]}。${bad.q.ex}<br>${DRILL[bad.q.it]}</p>`:'<p class="ok">全部答啱！</p>'}
 <p class="small">答案線：橙＝阻力（供給）、藍＝支持（需求）、紫＝入場、灰虛線＝止蝕、黃虛線＝目標。教學用途，非投資建議。</p>
 <button id="nx">${RD.n<2?'下一題':'完成本輪'}</button></div>`;
 drawChart($('cv'),sc,true);$('nx').onclick=()=>{if(RD.n<2){RD.n++;nextQ()}else summary()}}

 app().innerHTML=`<div class="card"><h1>本輪完成：${t}/21</h1><p>各題：${RD.res.join(' / ')}</p><p class="small">答錯嘅形態已加入弱點清單，之後會隔幾題再出現。</p><button id="a">再來一輪</button><button class="alt" id="h">返回主頁</button></div>`;
 $('a').onclick=()=>startRound(RD.level);$('h').onclick=()=>home()}
if(typeof document!=='undefined'&&document.getElementById('app'))home();
if(typeof module!=='undefined')module.exports={genScenario,buildQs,drawChart,PATTERNS};
